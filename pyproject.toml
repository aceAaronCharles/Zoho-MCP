[project]
name = "zoho-mcp"
version = "1.0.0"
description = "A comprehensive Model Context Protocol server for the Zoho ecosystem (CRM, Books, Projects, Desk, People, Recruit, Inventory, Analytics, Creator and more)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "JunnAI", email = "jennifer@junnaisystem.com" }
]
keywords = ["zoho", "crm", "mcp", "ai", "integration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Communications :: Email",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0,<3",
    "requests>=2.31.0,<3",
    "python-dotenv>=1.0.0,<2",
    "uvicorn>=0.24.0,<1",
    "starlette>=0.27.0,<2",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.27.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]

[project.urls]
Homepage = "https://junnaisystem.com"
Documentation = "https://github.com/junnaisystems/zoho-crm-mcp#readme"
Repository = "https://github.com/junnaisystems/zoho-crm-mcp"
Issues = "https://github.com/junnaisystems/zoho-crm-mcp/issues"
Website = "https://junnaisystem.com"
Support = "https://junnaisystem.com/contact"

[project.scripts]
zoho-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]