name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: zoho-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health + auth guard)
        run: |
          docker run -d --name zoho-mcp-ci -p 8000:8000 \
            -e MCP_TRANSPORT=http \
            -e MCP_HTTP_TOKEN=ci-token \
            zoho-mcp:ci
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then echo "server did not become healthy"; docker logs zoho-mcp-ci; exit 1; fi
          curl -fsS http://127.0.0.1:8000/health | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/mcp)" = "401"
          echo "health OK; unauthenticated /mcp correctly rejected"
          docker logs zoho-mcp-ci | tail -5
          docker rm -f zoho-mcp-ci

  scan:
    name: image vulnerability scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: zoho-mcp:ci
          cache-from: type=gha
      - name: Trivy (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: zoho-mcp:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: publish to GHCR
    needs: [build, scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GHCR rejects uppercase repository names, so lower-case it explicitly.
      - name: Resolve image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
